# Routes each request to one of the three apps (deploy/launch.py fills in
# __PORT__ and starts nginx with this file).
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  # Per site below: a few huge uploads at once could otherwise fill the
  # container's memory and take all three sites down.
  client_max_body_size 10m;

  # smmshiro.com and its subdomains -> smm-panel. Everything else is
  # shironc.com (including shironc-server.onrender.com).
  map $host $site_by_host {
    ~(^|\.)smmshiro\.com$   smm;
    ~(^|\.)shirochat\.com$  chat;
    default                 nc;
  }
  # shirochat.com reaches us through the shiro-web Cloudflare Worker, which
  # fetches this service's onrender.com address (so the Host is ours), but
  # always adds x-shiro-proxy.
  map $http_x_shiro_proxy $site {
    ""      $site_by_host;
    default chat;
  }

  upstream nc   { server 127.0.0.1:8001; }
  upstream smm  { server 127.0.0.1:8002; }
  upstream chat { server 127.0.0.1:8003; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
  }

  server {
    listen __PORT__ default_server;

    # shironc.com's /transcribe takes audio up to Groq's 25 MB.
    location = /transcribe {
      client_max_body_size 26m;
      proxy_pass http://$site;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://$site;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Pass responses through as they come (streamed replies) and give slow
      # ones (image generation) time.
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
